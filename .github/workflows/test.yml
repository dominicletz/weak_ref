name: "Test"
on: ["push", "pull_request"]

jobs:
  test_and_build:
    name: "Compile & Lint"
    strategy:
      matrix:
        os: ["ubuntu-latest"]
#        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Setup elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: 26.2.5.6
        elixir-version: 1.18.1

    - uses: actions/checkout@v1
    - run: |
        mix deps.get
        mix compile --warnings-as-errors
        mix format --check-formatted
        mix test
